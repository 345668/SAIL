name: Deploy to Vercel (production)

# Deploys the company portal to Vercel production on every push to main.
# Runtime env vars (NEON_DATABASE_URL, SECRET_KEY, TENANT_APP_URL) live in the
# Vercel project's Production environment and are pulled by `vercel pull` — they
# are NOT stored in this repo. The workflow only needs the three Vercel secrets.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        a Vercel access token (vercel.com/account/tokens)
#   VERCEL_ORG_ID       from `vercel link` → .vercel/project.json ("orgId")
#   VERCEL_PROJECT_ID   from `vercel link` → .vercel/project.json ("projectId")

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One production deploy at a time; newer pushes cancel an in-flight run.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip forks / secretless runs so the job doesn't fail red without a token.
    if: ${{ github.repository == '345668/SAIL' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
